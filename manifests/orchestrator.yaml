apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: orchestrator
  namespace: default
  labels:
    dissertation/pipeline: log-pipeline
    dissertation/function: orchestrator
spec:
  template:
    metadata:
      labels:
        dissertation/function: orchestrator
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "0s"
    spec:
      timeoutSeconds: 300
      containers:
        - name: user-container
          image: dev.local/orchestrator:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 5